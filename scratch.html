<!DOCTYPE html>
<html>
<body>
  <svg viewBox="0 0 200 170" style="width: 260px; background: #222;">
    <path id="bg" fill="none" stroke="#2C2C2E" stroke-width="10" stroke-linecap="round" />
    <path id="val" fill="none" stroke="#30D158" stroke-width="10" stroke-linecap="round" />
  </svg>
  <script>
    const MIN = 80; const MAX = 240; const CX = 100; const CY = 105; const R = 80;
    const START_DEG = 210; const SWEEP = 240;
    function pt(angleDeg) {
      const rad = (angleDeg * Math.PI) / 180;
      return { x: CX + R * Math.cos(rad), y: CY - R * Math.sin(rad) };
    }
    const S = pt(START_DEG);
    function arcPath(from, to, sweepDeg) {
      if (sweepDeg <= 0) return '';
      const large = sweepDeg > 180 ? 1 : 0;
      return \`M \${from.x.toFixed(2)} \${from.y.toFixed(2)} A \${R} \${R} 0 \${large} 1 \${to.x.toFixed(2)} \${to.y.toFixed(2)}\`;
    }
    document.getElementById('bg').setAttribute('d', arcPath(S, pt(START_DEG - SWEEP), SWEEP));
    document.getElementById('val').setAttribute('d', arcPath(S, pt(START_DEG - 50), 50));
  </script>
</body>
</html>
